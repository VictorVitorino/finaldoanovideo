<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projeto do Ano — A&amp;M + TOTVS</title>
<style>
  @font-face { font-family: 'Outfit'; font-weight: 600; src: url('./node_modules/@fontsource/outfit/files/outfit-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Outfit'; font-weight: 700; src: url('./node_modules/@fontsource/outfit/files/outfit-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Outfit'; font-weight: 800; src: url('./node_modules/@fontsource/outfit/files/outfit-latin-800-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Outfit'; font-weight: 900; src: url('./node_modules/@fontsource/outfit/files/outfit-latin-900-normal.woff2') format('woff2'); }
  @font-face { font-family: 'DM Sans'; font-weight: 500; src: url('./node_modules/@fontsource/dm-sans/files/dm-sans-latin-500-normal.woff2') format('woff2'); }
  @font-face { font-family: 'DM Sans'; font-weight: 700; src: url('./node_modules/@fontsource/dm-sans/files/dm-sans-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'DM Sans'; font-weight: 800; src: url('./node_modules/@fontsource/dm-sans/files/dm-sans-latin-800-normal.woff2') format('woff2'); }
  html, body { margin: 0; background: #1b1d24; color: #eef0f7; font-family: 'DM Sans', system-ui, sans-serif; }
  body.render { background: #000; overflow: hidden; }
  html.transparent, body.transparent, body.transparent #wrap { background: transparent !important; }
  #wrap { position: relative; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; }
  body:not(.render) #wrap { margin: 16px auto 0; border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  #stage { display: block; }
  #bar { display: none; gap: 10px; align-items: center; max-width: 1280px; margin: 12px auto; padding: 0 16px; }
  body:not(.render) #bar { display: flex; }
  #bar input { flex: 1; }
  #bar button { background: #0b5ed7; color: #fff; border: 0; border-radius: 8px; padding: 8px 16px; font-weight: 700; cursor: pointer; }
  #time { font-variant-numeric: tabular-nums; min-width: 90px; text-align: right; }
</style>
</head>
<body>
<div id="wrap">
  <svg id="stage" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
    <defs id="defs"></defs>
    <g id="warm" opacity="0.01"></g>
    <g id="dyn"></g>
  </svg>
</div>
<div id="bar"><button id="play">▶ Tocar</button><input id="scrub" type="range" min="0" step="0.01" value="0"><span id="time">0.00 s</span></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
